name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm run test
      - run: npm run build

  dogfood:
    # Exercises the published action end-to-end (registry install, JSON
    # report, verdict output) against a consumer fixture with a real change.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare consumer fixture
        run: |
          rm -rf /tmp/ai-verify-consumer
          mkdir -p /tmp/ai-verify-consumer
          cd /tmp/ai-verify-consumer
          git init -q
          git -c user.email=ci@local -c user.name=ci commit -q --allow-empty -m init
          printf 'export const answer = 42;\n' > answer.ts
      - id: verify
        uses: ./
        with:
          path: /tmp/ai-verify-consumer
      - run: echo "verdict=${{ steps.verify.outputs.verdict }}"
